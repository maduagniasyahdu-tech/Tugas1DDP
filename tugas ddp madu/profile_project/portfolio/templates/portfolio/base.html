<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Madu Agnia Syahdu | Digital Portfolio{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.45);
            --neon-pink: #ff85a2;
            --deep-purple: #4a148c;
            --accent-orange: #ffac81;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8f9fa;
            /* Background Mesh Animasi */
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 133, 162, 0.15) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(74, 20, 140, 0.1) 0, transparent 50%);
            color: var(--deep-purple);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navbar Styling */
        .navbar {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s ease;
        }

        .navbar-brand {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            background: linear-gradient(45deg, var(--neon-pink), var(--deep-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }

        .nav-link {
            font-weight: 600;
            color: var(--deep-purple) !important;
            margin: 0 15px;
            position: relative;
            transition: 0.3s;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background: var(--neon-pink);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Custom Glass Card Global */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            padding: 40px;
        }

        /* Footer */
        footer {
            padding: 60px 0 30px;
            background: transparent;
            font-weight: 400;
            color: #888;
        }

        .social-links a {
            color: var(--deep-purple);
            font-size: 1.5rem;
            margin: 0 10px;
            transition: 0.3s;
            opacity: 0.6;
        }

        .social-links a:hover {
            opacity: 1;
            color: var(--neon-pink);
            transform: translateY(-3px);
            display: inline-block;
        }

        /* Scrollbar Aesthetic */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top px-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Portfolio</a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="ms-auto d-flex align-items-center">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                    <a class="nav-link" href="{% url 'about' %}">About</a>
                    <a class="nav-link" href="{% url 'gallery' %}">Gallery</a>
                </div>
            </div>
        </div>
    </nav>

    <div style="padding-top: 120px; padding-bottom: 50px;">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center">
        <div class="container">
            <div class="social-links mb-4">
                <a href="https://www.instagram.com/agniasyaa?igsh=bmwzNzN0bnEzanR2"><i class="fab fa-instagram"></i></a>
            </div>
            <p>&copy; 2026 Crafted with <i class="fas fa-heart" style="color: var(--neon-pink);"></i> by <strong>Madu Agnia Syahdu</strong></p>
            <small class="text-muted">TI Student @ STT Nurul Fikri</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
